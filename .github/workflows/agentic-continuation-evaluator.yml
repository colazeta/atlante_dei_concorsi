name: Governed agentic continuation evaluator

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to evaluate; leave empty to scan all open agent-running issues"
        required: false
        type: string
      apply:
        description: "Apply recommended label mutation from agent-running"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  issues: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve apply mode
        id: resolve
        env:
          INPUT_APPLY: ${{ inputs.apply }}
        run: |
          echo "apply=${INPUT_APPLY:-true}" >> "$GITHUB_OUTPUT"

      - name: Run continuation evaluator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          APPLY: ${{ steps.resolve.outputs.apply }}
        run: |
          ARGS=(--repo "${{ github.repository }}")
          if [ -n "$ISSUE_NUMBER" ]; then
            ARGS+=(--issue-number "$ISSUE_NUMBER")
          fi
          if [ "$APPLY" = "true" ]; then
            ARGS+=(--apply)
          fi
          python scripts/agentic_post_run_evaluator.py "${ARGS[@]}"

      - name: Commit evaluator state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agentic-dispatcher/post_run_evaluator_state.json reports/codex-handoff-queue/
          if git diff --cached --quiet; then
            echo "No evaluator-state changes to commit."
            exit 0
          fi
          git commit -m "Record governed agentic continuation evaluator state"
          git push
