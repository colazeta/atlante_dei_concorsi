name: Governed agentic dispatcher

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Dispatcher mode"
        required: false
        default: "controlled"
        type: choice
        options:
          - "dry_run"
          - "controlled"
      label:
        description: "Issue label used to select eligible work"
        required: false
        default: "agent-ready"
        type: string
      comment:
        description: "Post a handoff comment in controlled mode"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"
      mutate_labels:
        description: "Move selected issue from agent-ready to agent-running in controlled mode"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve dispatcher inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LABEL: ${{ inputs.label }}
          INPUT_COMMENT: ${{ inputs.comment }}
          INPUT_MUTATE: ${{ inputs.mutate_labels }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "mode=controlled" >> "$GITHUB_OUTPUT"
            echo "label=agent-ready" >> "$GITHUB_OUTPUT"
            echo "comment=true" >> "$GITHUB_OUTPUT"
            echo "mutate=true" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${INPUT_MODE:-controlled}" >> "$GITHUB_OUTPUT"
            echo "label=${INPUT_LABEL:-agent-ready}" >> "$GITHUB_OUTPUT"
            echo "comment=${INPUT_COMMENT:-true}" >> "$GITHUB_OUTPUT"
            echo "mutate=${INPUT_MUTATE:-true}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run dispatcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.resolve.outputs.mode }}
          LABEL: ${{ steps.resolve.outputs.label }}
          COMMENT: ${{ steps.resolve.outputs.comment }}
          MUTATE: ${{ steps.resolve.outputs.mutate }}
        run: |
          ARGS=(--repo "${{ github.repository }}" --mode "$MODE" --label "$LABEL")
          if [ "$COMMENT" = "true" ]; then
            ARGS+=(--comment)
          fi
          if [ "$MUTATE" = "true" ]; then
            ARGS+=(--mutate-labels)
          fi
          python scripts/agentic_dispatcher.py "${ARGS[@]}"

      - name: Commit dispatcher state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agentic-dispatcher
          if git diff --cached --quiet; then
            echo "No dispatcher-state changes to commit."
            exit 0
          fi
          git commit -m "Record governed agentic dispatcher state"
          git push
