name: Governed agentic loop

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number controlling the loop"
        required: true
        type: string
      mode:
        description: "Execution mode"
        required: false
        default: "dry_run"
        type: choice
        options:
          - "dry_run"
          - "controlled_implementation"
      task:
        description: "Controlled task name, required only for controlled implementation"
        required: false
        type: string
      procedure_id:
        description: "Optional procedure/review identifier for neutral scaffolding"
        required: false
        type: string
      skip_validators:
        description: "Skip methodology/golden-dataset validators"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  governed-loop:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run governed loop
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          LOOP_MODE: ${{ inputs.mode }}
          LOOP_TASK: ${{ inputs.task }}
          PROCEDURE_ID: ${{ inputs.procedure_id }}
          SKIP_VALIDATORS: ${{ inputs.skip_validators }}
        run: |
          ARGS=(--issue-number "$ISSUE_NUMBER" --mode "$LOOP_MODE")
          if [ -n "$LOOP_TASK" ]; then
            ARGS+=(--task "$LOOP_TASK")
          fi
          if [ -n "$PROCEDURE_ID" ]; then
            ARGS+=(--procedure-id "$PROCEDURE_ID")
          fi
          if [ "$SKIP_VALIDATORS" = "true" ]; then
            ARGS+=(--skip-validators)
          fi
          python scripts/agentic_loop.py "${ARGS[@]}"

      - name: Validate agentic-loop state
        run: |
          python scripts/validate_agentic_loop_state.py

      - name: Commit loop state and execution log if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agentic-loop docs/executions
          if git diff --cached --quiet; then
            echo "No loop-state changes to commit."
            exit 0
          fi
          git commit -m "Record governed agentic loop run for issue #${{ inputs.issue_number }}"
          git push
