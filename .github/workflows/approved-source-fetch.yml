name: Approved Source Fetch

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Universities batch size'
        required: false
        default: '5'
      university_id:
        description: 'Optional single university id'
        required: false
        default: ''
      max_links_per_page:
        description: 'Max candidate links per fetched page'
        required: false
        default: '40'
      max_follow_links_per_university:
        description: 'Max depth-1 follow links per university'
        required: false
        default: '10'
      depth:
        description: 'Discovery depth (0 or 1)'
        required: false
        default: '0'

jobs:
  fetch-approved-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded approved-source fetch
        run: |
          python3 scripts/fetch_approved_source_pages.py \
            --batch-size "${{ github.event.inputs.batch_size }}" \
            --university-id "${{ github.event.inputs.university_id }}" \
            --max-links-per-page "${{ github.event.inputs.max_links_per_page }}" \
            --max-follow-links-per-university "${{ github.event.inputs.max_follow_links_per_university }}" \
            --depth "${{ github.event.inputs.depth }}"
      - name: Rebuild progress layers
        run: |
          python3 scripts/build_source_inventory_progress.py
          python3 scripts/build_document_link_classification_progress.py
