name: Deploy mapping UX to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/build_university_registry_json.py"
      - "scripts/build_mapping_progress_history.py"
      - "scripts/build_document_link_classification_progress.py"
      - "scripts/build_automation_status.py"
      - "data/source-registries/italian-universities/official_university_urls.csv"
      - "data/source-registries/italian-universities/missing_universities_to_verify.csv"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build mapping site data
        run: |
          python3 scripts/build_university_registry_json.py
          python3 scripts/build_mapping_progress_history.py
          if [ -f scripts/build_source_inventory_progress.py ]; then
            python3 scripts/build_source_inventory_progress.py
          else
            echo "scripts/build_source_inventory_progress.py not found; skipping source-inventory progress build."
          fi
          if [ -f scripts/build_document_link_classification_progress.py ]; then
            python3 scripts/build_document_link_classification_progress.py
          else
            echo "scripts/build_document_link_classification_progress.py not found; skipping document-link classification progress build."
          fi
          if [ -f scripts/build_automation_status.py ]; then
            python3 scripts/build_automation_status.py
          else
            echo "scripts/build_automation_status.py not found; skipping automation status build."
          fi

      - name: Note scheduled-run cadence
        run: echo "GitHub Actions scheduled workflows are best-effort and may not execute exactly every 10 minutes."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
