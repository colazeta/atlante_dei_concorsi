name: Pages UX evaluator

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run governed UX evaluator
        run: python3 scripts/evaluate_pages_validation_ux.py
      - name: Commit UX evaluator report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ux-evaluator
          git diff --cached --quiet && exit 0
          git commit -m "Record Pages UX evaluator report"
          git push
