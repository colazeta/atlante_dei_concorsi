name: Pages UX iteration agent

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      autonomy:
        description: 'UX iteration autonomy level'
        required: false
        default: 'iteration'
        type: choice
        options:
          - safe
          - iteration
          - broad

permissions:
  contents: write
  pull-requests: write

jobs:
  ux-iterate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve autonomy
        id: autonomy
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AUTONOMY: ${{ inputs.autonomy }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "level=iteration" >> "$GITHUB_OUTPUT"
          else
            echo "level=${INPUT_AUTONOMY:-iteration}" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh UX evaluator state
        run: python3 scripts/evaluate_pages_validation_ux.py
      - name: Apply governed UX iteration updates
        run: python3 scripts/apply_pages_ux_safe_updates.py --apply --autonomy "${{ steps.autonomy.outputs.level }}"
      - name: Detect UX iteration changes
        id: changes
        run: |
          if git diff --quiet -- site/index.html reports/ux-evaluator reports/ux-safe-updates; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update UX iteration branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/pages-ux-iteration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add site/index.html reports/ux-evaluator reports/ux-safe-updates
          git commit -m "Apply governed Pages UX iteration"
          git push --force-with-lease origin "$BRANCH"
      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/pages-ux-iteration
        run: |
          BODY="Automated governed UX iteration PR.\n\nThis PR may contain broader UI, layout, copy or review-flow improvements generated by the Pages UX iteration agent.\n\nIt must still pass validation and requires normal PR review before merge. The agent must not merge its own PR."
          if gh pr view "$BRANCH" --base main >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --base main --title "Apply governed Pages UX iteration" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "Apply governed Pages UX iteration" --body "$BODY"
          fi
