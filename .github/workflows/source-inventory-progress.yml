name: Source inventory progress
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build source inventory progress
        run: python3 scripts/build_source_inventory_progress.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/executions/approved-source-inventories site/data/source_inventory_progress.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh source inventory progress"
          git push
