name: Test source inventory fetch cycle

on:
  push:
    branches:
      - fix/source-inventory-fetch-cycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fetch-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source fetch script
        run: python3 -m py_compile scripts/fetch_approved_source_pages.py
      - name: Run bounded one-university fetch smoke test
        run: python3 scripts/fetch_approved_source_pages.py --batch-size 1 --depth 0
      - name: Rebuild progress layers
        run: |
          python3 scripts/build_source_inventory_progress.py
          python3 scripts/build_document_link_classification_progress.py
          python3 scripts/build_automation_status.py
      - name: Assert source inventory progressed beyond empty eligibility
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('site/data/source_inventory_progress.json').read_text())
          assert status.get('universities_selected', 0) >= 1, status
          assert status.get('seed_urls_attempted', 0) >= 1, status
          assert status.get('run_status') != 'skipped_no_eligible_urls', status
          print(json.dumps({
              'run_status': status.get('run_status'),
              'universities_selected': status.get('universities_selected'),
              'universities_fetched': status.get('universities_fetched'),
              'seed_urls_attempted': status.get('seed_urls_attempted'),
              'candidate_links_found': status.get('candidate_links_found'),
              'fetch_errors': status.get('fetch_errors'),
          }, indent=2))
          PY
