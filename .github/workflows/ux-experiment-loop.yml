name: UX experiment loop

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build aggregate UX experiment queue
        run: python3 scripts/build_ux_experiment_queue.py
      - name: Commit UX experiment reports if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ux-experiments
          git diff --cached --quiet && exit 0
          git commit -m "Record UX experiment proposals"
          git push
