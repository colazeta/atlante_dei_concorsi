name: Validate agentic loop foundation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/agentic-loop/**"
      - "docs/executions/**"
      - "reports/agentic-loop/**"
      - "schemas/agentic-loop/**"
      - "scripts/agentic_loop.py"
      - "scripts/validate_agentic_loop_state.py"
      - ".github/workflows/agentic-loop.yml"
      - ".github/workflows/validate-agentic-loop.yml"
      - "scripts/validate_atlante_methodology.py"
      - "scripts/validate_golden_dataset.py"
      - "data/templates/atlante-concorsi-universitari/**"
      - "schemas/atlante-concorsi-universitari/**"
      - "data/golden-dataset/atlante-concorsi-universitari/**"
      - "docs/atlante-concorsi-universitari/**"
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate existing methodology
        run: |
          python scripts/validate_atlante_methodology.py

      - name: Validate golden dataset safeguards
        run: |
          python scripts/validate_golden_dataset.py

      - name: Validate agentic-loop state
        run: |
          python scripts/validate_agentic_loop_state.py

      - name: Dry-run agentic loop without substantive changes
        run: |
          python scripts/agentic_loop.py --issue-number 42 --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Controlled implementation checklist smoke test
        run: |
          python scripts/agentic_loop.py \
            --issue-number 44 \
            --mode controlled_implementation \
            --task prepare-empty-review-checklist \
            --procedure-id ACU-REVIEW-PLACEHOLDER \
            --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Controlled implementation review-pack smoke test
        run: |
          python scripts/agentic_loop.py \
            --issue-number 50 \
            --mode controlled_implementation \
            --task prepare-procedure-review-pack \
            --procedure-id ACU-REVIEW-PACK-PLACEHOLDER \
            --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Controlled implementation source-intake smoke test
        run: |
          python scripts/agentic_loop.py \
            --issue-number 52 \
            --mode controlled_implementation \
            --task prepare-source-intake-pack \
            --procedure-id ACU-SOURCE-INTAKE-PLACEHOLDER \
            --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Controlled implementation collection-plan smoke test
        run: |
          python scripts/agentic_loop.py \
            --issue-number 54 \
            --mode controlled_implementation \
            --task prepare-collection-plan-from-intake \
            --procedure-id ACU-SOURCE-INTAKE-PLACEHOLDER \
            --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Controlled implementation gate-decision smoke test
        run: |
          python scripts/agentic_loop.py \
            --issue-number 56 \
            --mode controlled_implementation \
            --task evaluate-collection-approval-gates \
            --procedure-id ACU-SOURCE-INTAKE-PLACEHOLDER \
            --skip-validators
          python scripts/validate_agentic_loop_state.py
