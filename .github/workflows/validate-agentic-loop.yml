name: Validate agentic loop foundation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/agentic-loop/**"
      - "docs/executions/**"
      - "reports/agentic-loop/**"
      - "reports/agentic-dispatcher/**"
      - "reports/ux-evaluator/**"
      - "schemas/agentic-loop/**"
      - "site/**"
      - "scripts/agentic_loop.py"
      - "scripts/agentic_dispatcher.py"
      - "scripts/fetch_approved_source_pages.py"
      - "scripts/build_document_link_triage.py"
      - "scripts/build_document_link_triage_json.py"
      - "scripts/build_automation_status.py"
      - "scripts/evaluate_pages_validation_ux.py"
      - "scripts/validate_agentic_loop_state.py"
      - ".github/workflows/agentic-loop.yml"
      - ".github/workflows/agentic-dispatcher.yml"
      - ".github/workflows/source-inventory-progress.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/pages-ux-evaluator.yml"
      - ".github/workflows/validate-agentic-loop.yml"
      - "scripts/validate_atlante_methodology.py"
      - "scripts/validate_golden_dataset.py"
      - "data/templates/atlante-concorsi-universitari/**"
      - "schemas/atlante-concorsi-universitari/**"
      - "data/golden-dataset/atlante-concorsi-universitari/**"
      - "docs/atlante-concorsi-universitari/**"
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate existing methodology
        run: |
          python scripts/validate_atlante_methodology.py

      - name: Validate golden dataset safeguards
        run: |
          python scripts/validate_golden_dataset.py

      - name: Validate source-inventory fetch, classification and triage cycle
        run: |
          python -m py_compile scripts/fetch_approved_source_pages.py
          python -m py_compile scripts/build_document_link_triage.py
          python -m py_compile scripts/build_document_link_triage_json.py
          python -m py_compile scripts/evaluate_pages_validation_ux.py
          python scripts/fetch_approved_source_pages.py --batch-size 1 --depth 0
          python scripts/build_source_inventory_progress.py
          python scripts/build_document_link_classification_progress.py
          python scripts/build_document_link_triage.py
          python scripts/build_document_link_triage_json.py
          python scripts/build_automation_status.py
          python scripts/evaluate_pages_validation_ux.py
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          source_status = json.loads(Path('site/data/source_inventory_progress.json').read_text())
          triage_status = json.loads(Path('site/data/document_link_triage_progress.json').read_text())
          automation_status = json.loads(Path('site/data/automation_status.json').read_text())
          triage_json = json.loads(Path('site/data/document_link_triage_index.json').read_text())
          ux_state = json.loads(Path('reports/ux-evaluator/latest_state.json').read_text())

          assert source_status.get('universities_selected', 0) >= 1, source_status
          assert source_status.get('seed_urls_attempted', 0) >= 1, source_status
          assert source_status.get('run_status') != 'skipped_no_eligible_urls', source_status

          triage_rows = list(csv.DictReader(Path('docs/executions/document-link-triage/document_link_triage_index.csv').open(encoding='utf-8')))
          candidate_total = 0
          for path in Path('docs/executions/approved-source-inventories').glob('*/candidate_document_links.csv'):
              candidate_total += sum(1 for _ in csv.DictReader(path.open(encoding='utf-8')))

          allowed = {
              'likely_competition_source',
              'possible_competition_source',
              'generic_institutional_page',
              'likely_not_relevant',
              'unknown_requires_review',
          }
          assert len(triage_rows) == candidate_total, (len(triage_rows), candidate_total)
          assert triage_status.get('total_triaged_links') == candidate_total, triage_status
          assert triage_json.get('metadata', {}).get('row_count') == candidate_total, triage_json.get('metadata')
          assert len(triage_json.get('entries', [])) == candidate_total, triage_json.get('metadata')
          assert all(row.get('triage_status') in allowed for row in triage_rows), triage_rows[:5]
          assert all(row.get('exclusion_reason') for row in triage_rows if row.get('exclude_from_competition_queue') == 'yes'), triage_rows[:5]
          assert all(row.get('requires_human_attention') == 'yes' for row in triage_rows if row.get('triage_status') == 'unknown_requires_review'), triage_rows[:5]
          assert 'triaged_links' in automation_status.get('latest_counts', {}), automation_status

          html = Path('site/index.html').read_text(encoding='utf-8')
          required_dom = [
              'priority-queue',
              'triage-rows',
              'document_link_triage_index.json',
              'bulk-link-decision',
              'download-link-decisions-csv',
              'submit-link-decisions-github',
              'submit-selected-link-decisions-github',
              'quick-approve',
              'submit-one',
          ]
          missing = [marker for marker in required_dom if marker not in html]
          assert not missing, missing
          assert ux_state.get('status') == 'completed', ux_state
          assert ux_state.get('findings'), ux_state
          assert 'has_single_row_approve' in ux_state.get('checks', {}), ux_state

          print(json.dumps({
              'source_run_status': source_status.get('run_status'),
              'universities_selected': source_status.get('universities_selected'),
              'candidate_links_found': source_status.get('candidate_links_found'),
              'triaged_links': triage_status.get('total_triaged_links'),
              'kept_for_review': triage_status.get('kept_for_review'),
              'excluded_from_competition_queue': triage_status.get('excluded_from_competition_queue'),
              'ux_focus_area': ux_state.get('focus_area'),
              'ux_human_review_required': ux_state.get('human_review_required'),
          }, indent=2))
          PY

      - name: Validate agentic-loop state
        run: |
          python scripts/validate_agentic_loop_state.py

      - name: Dry-run agentic loop without substantive changes
        run: |
          python scripts/agentic_loop.py --issue-number 42 --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Controlled implementation checklist smoke test
        run: |
          python scripts/agentic_loop.py \
            --issue-number 44 \
            --mode controlled_implementation \
            --task prepare-empty-review-checklist \
            --procedure-id ACU-REVIEW-PLACEHOLDER \
            --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Controlled implementation review-pack smoke test
        run: |
          python scripts/agentic_loop.py \
            --issue-number 50 \
            --mode controlled_implementation \
            --task prepare-procedure-review-pack \
            --procedure-id ACU-REVIEW-PACK-PLACEHOLDER \
            --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Controlled implementation source-intake smoke test
        run: |
          python scripts/agentic_loop.py \
            --issue-number 52 \
            --mode controlled_implementation \
            --task prepare-source-intake-pack \
            --procedure-id ACU-SOURCE-INTAKE-PLACEHOLDER \
            --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Controlled implementation collection-plan smoke test
        run: |
          python scripts/agentic_loop.py \
            --issue-number 54 \
            --mode controlled_implementation \
            --task prepare-collection-plan-from-intake \
            --procedure-id ACU-SOURCE-INTAKE-PLACEHOLDER \
            --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Controlled implementation gate-decision smoke test
        run: |
          python scripts/agentic_loop.py \
            --issue-number 56 \
            --mode controlled_implementation \
            --task evaluate-collection-approval-gates \
            --procedure-id ACU-SOURCE-INTAKE-PLACEHOLDER \
            --skip-validators
          python scripts/validate_agentic_loop_state.py

      - name: Dispatcher dry-run smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/agentic_dispatcher.py \
            --repo "${{ github.repository }}" \
            --mode dry_run \
            --label agent-ready
          test -f reports/agentic-dispatcher/dispatcher_state.json
